# media-dl 配置模板
# 复制为 config.toml 后修改；config.toml 已加入 .gitignore，不会进版本库。
# 本文件本身会被提交，作为默认值参考。

[general]
# 下载根目录。Termux 用 ~/storage/shared/Download/media，Windows 可改成 D:\下载
output_dir      = "~/storage/shared/Download/media"
proxy           = "http://127.0.0.1:7890"   # flclash 混合端口；留空则读 ALL_PROXY / HTTPS_PROXY
download_timeout = 60
retries         = 2
log_dir         = "~/.local/state/media-dl/logs"
lock_file       = "~/.local/state/media-dl/.lock"
state_dir       = "~/.local/state/media-dl"   # 锁、日志、备份、元数据缓存都放这里

[quality]
max_height      = 720

[cover]
enabled         = true
# 只有列在这里的平台才处理封面，其余平台一律不下载封面
embed_platforms = ["bilibili", "youtube"]
# 上述平台使用的封面模式：embed(嵌进 mp4) / sidecar(存同名 jpg) / both
mode            = "embed"
# 未列出的平台用这个（设为 none 即不下载封面）
others_mode     = "none"

[naming]
# 全局默认：平台_作者_内容id_序号
default         = "{platform}_{author}_{id}_{index}"
# 单文件时自动省略 {index}
omit_index_when_single = true
max_len         = 120

# 平台级模板，优先级高于 default。
# 这些模板设计成“可逆”：能从文件名拆回字段，再拼回作品网址。
# {author} 统一用可重建网址的稳定标识（推特 handle、TikTok @handle），
# 展示用昵称请用 {nickname}。
twitter         = "twitter_{author}_{id}"
xhs             = "xhs_{author}_{id}"
douyin          = "douyin_{author}_{id}"
tiktok          = "tiktok_{author}_{id}"
bilibili        = "bilibili_{author}_{id}"
youtube         = "youtube_{author}_{id}"
telegram        = "telegram_{author}_{id}"

[urls]
# 文件名 → 网址的重建规则；{id} 必需，{author} 视平台而定。
# 可改成你常用的镜像站。
twitter         = "https://x.com/i/status/{id}"
xhs             = "https://www.xiaohongshu.com/explore/{id}"
douyin          = "https://www.douyin.com/video/{id}"
tiktok          = "https://www.tiktok.com/@{author}/video/{id}"
bilibili        = "https://www.bilibili.com/video/{id}"
youtube         = "https://www.youtube.com/watch?v={id}"
telegram        = "https://t.me/{author}/{id}"

[patterns]
# 旧文件的额外反向模板，可写多条：
# legacy = ["{platform}-{author}-{id}", "旧前缀_{id}"]

[behavior]
# 下载 / 改名 / 替换后，把文件时间改成作品发布时间
set_mtime       = true
# 目标已存在时默认跳过；true 则先备份再覆盖
overwrite       = false
backup_dir      = "~/.local/state/media-dl/backup"
# auto = 优先回收站，失败/不支持时移到 .trash/日期；也支持 dir / backup / none
trash           = "auto"
# 首次运行提醒旧文件名可能无法反推网址
first_run_notice = true
warn_unparsable = true
# 元数据缓存天数，改名 / 重下时避免重复请求
probe_cache_ttl_days = 7

[platforms]
enabled         = ["twitter", "xhs", "douyin", "tiktok", "bilibili", "telegram", "youtube"]

[platforms.xhs]
delay_sec       = 3

[platforms.douyin]
delay_sec       = 1

[cookies]
dir             = "~/cookies"
# 不写时默认读取 <dir>/<平台名>.txt
# twitter       = "~/cookies/twitter.txt"
# xhs           = "~/cookies/xhs.txt"
# bilibili      = "~/cookies/bilibili.txt"
# tiktok        = "~/cookies/tiktok.txt"
